server {
    listen 80;
    server_name _;

    # --- Frontend (Angular) ---
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # SPA: qualquer rota que não seja um arquivo real cai no index.html,
        # deixando o Angular Router decidir o que renderizar (evita 404 ao
        # atualizar a página em rotas como /produtos ou /carrinho).
        try_files $uri $uri/ /index.html;
    }

    # --- Backend (Spring Boot) ---
    # Tudo que começa com /api é repassado para o container do backend.
    # "backend" é o nome do serviço no docker-compose.yml — o Docker
    # resolve isso automaticamente via DNS interno da rede do Compose.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check do próprio backend, útil para debug manual
    location /actuator/health {
        proxy_pass http://backend:8080/actuator/health;
    }
}
